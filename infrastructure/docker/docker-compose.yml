# EAOC Docker Compose Specification
# Local Development Infrastructure Services

version: "3.8"

networks:
  eaoc-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_models:

services:
  redis:
    image: redis:7-alpine
    container_name: eaoc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eaoc-internal
    restart: unless-stopped
